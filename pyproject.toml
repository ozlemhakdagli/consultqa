[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "consultqa"
version = "0.2.0"
description = "Question answering over uploaded documents with citations: hybrid retrieval, an evidence graph, reranking and an extractive or LLM reader."
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]

[project.optional-dependencies]
core = ["numpy==2.4.6", "scipy==1.17.1", "rank-bm25==0.2.2", "pypdfium2==5.14.0"]
ml = [
    "sentence-transformers==5.7.0",
    "transformers==4.57.6",
    "torch==2.14.1",
    "sentencepiece==0.2.2",
    "protobuf==7.36.2",
]
pdf = ["docling==2.137.0"]
api = [
    "fastapi==0.143.0",
    "uvicorn==0.54.0",
    "httpx==0.28.1",
    "python-multipart==0.0.32",
    "qdrant-client==1.19.1",
]
dev = ["pytest==9.1.1", "ruff==0.16.10", "reportlab==5.0.1"]
e2e = ["playwright==1.63.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"consultqa.eval" = ["judge_prompt.txt"]
