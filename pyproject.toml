[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hybrid-qa"
version = "0.1.0"
description = "Hybrid (FAISS + BM25) retrieval and XLM-RoBERTa extractive QA over update reports."
requires-python = ">=3.10"

[project.optional-dependencies]
core = ["numpy==2.4.6", "rank-bm25==0.2.2"]
ml = [
    "faiss-cpu==1.15.1",
    "sentence-transformers==5.7.0",
    "transformers==4.57.6",
    "torch==2.14.1",
    "sentencepiece==0.2.2",
    "protobuf==7.36.2",
]
pdf = ["PyMuPDF==1.28.2"]
dev = ["pytest==9.1.1", "ruff==0.16.10"]

[tool.setuptools.packages.find]
where = ["src"]
