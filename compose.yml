# Compose stack for consultqa. Every image tag is pinned to an exact version.
# First run: copy the pinned models into the models volume (README, Quick start), then
# CONSULTQA_BACKEND=real docker compose up -d --wait app. Without a model cache, fetch-models downloads them.
name: consultqa

x-app-build: &app-build
  context: .
  dockerfile: Dockerfile

services:
  app:
    build: *app-build
    image: consultqa:dev
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      CONSULTQA_BACKEND: ${CONSULTQA_BACKEND:-real}
      CONSULTQA_QDRANT_URL: http://qdrant:6333
      # The LLM reader is enabled only when these are set in .env, for example
      # CONSULTQA_LLM_BASE_URL=http://ollama:11434/v1 and CONSULTQA_LLM_MODEL=<a model pulled into ollama>.
      CONSULTQA_LLM_BASE_URL: ${CONSULTQA_LLM_BASE_URL:-}
      CONSULTQA_LLM_MODEL: ${CONSULTQA_LLM_MODEL:-}
      CONSULTQA_LLM_API_KEY: ${CONSULTQA_LLM_API_KEY:-}
    volumes:
      - models:/models
      - state:/app/state
    depends_on:
      qdrant:
        condition: service_healthy
    # Healthy only when the models are loaded (/api/ready answers 200), not merely when the
    # process is up. The first start loads several gigabytes, so the window is generous.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/ready', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
      start_interval: 1s
    restart: unless-stopped

  fetch-models:
    profiles: ["setup"]
    build: *app-build
    image: consultqa:dev
    working_dir: /app
    command: ["python", "scripts/fetch_models.py"]
    environment:
      HF_HUB_OFFLINE: "0"
    volumes:
      - models:/models

  qdrant:
    image: qdrant/qdrant:v1.19.1
    volumes:
      - qdrant:/qdrant/storage
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
      start_interval: 1s
    restart: unless-stopped

  ollama:
    profiles: ["llm"]
    image: ollama/ollama:0.40.3
    volumes:
      - ollama:/root/.ollama
    restart: unless-stopped

volumes:
  models:
  state:
  qdrant:
  ollama:
